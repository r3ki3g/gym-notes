<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Gym Notes</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏋️</text></svg>">
</head>
<body>
  <header id="topbar">
    <div class="who">
      <button id="profile-switch" class="chip" type="button">…</button>
    </div>
    <div id="sync" class="sync" title="Connection status"><span class="dot"></span><span class="sync-label">…</span></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav id="tabs">
    <button data-route="log"       type="button"><span>📋</span>Log</button>
    <button data-route="history"   type="button"><span>📅</span>History</button>
    <button data-route="exercises" type="button"><span>🏋️</span>Pool</button>
    <button data-route="profiles"  type="button"><span>👥</span>People</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
