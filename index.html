<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060d">
<title>BroSplit</title>
<!-- Theme before the stylesheet paints anything, so the app under the always-
     dark splash is already light when the splash fades. Dark is the default; Settings → Appearance writes gn.theme. -->
<script>
  try {
    if (localStorage.getItem('gn.theme') === 'light') {
      // the browser bar stays dark with the splash; app.js switches it after
      document.documentElement.setAttribute('data-theme', 'light');
    }
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles.css">
<!-- browser-tab icon: the Lucide dumbbell (as in the tab bar) on the app purple -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23a855f7'/><g transform='translate(5 5) scale(.92)' fill='none' stroke='white' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round'><path d='M14.4 14.4 9.6 9.6'/><path d='M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z'/><path d='m21.5 21.5-1.4-1.4'/><path d='M3.9 3.9 2.5 2.5'/><path d='M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z'/></g></svg>">
</head>
<body>
  <!-- Lives in the markup, not in JS, so it paints on the very first frame —
       before the module graph loads and well before anonymous auth returns. -->
  <div id="splash">
    <div class="splash-name">BroSplit</div>
    <div class="splash-pro">PRO</div>
    <!-- Work out → Log it → Track progress → Together (see .splash-steps) -->
    <img class="splash-steps" src="images/splash-steps.gif" width="480" height="124"
         alt="Work out, log it, track progress, together">
    <div class="splash-stage" id="splash-stage">starting…</div>
    <div class="splash-version" id="splash-version"></div>
  </div>

  <header id="topbar">
    <div class="brandrow">
      <span class="brand">BroSplit</span>
      <span class="pro">PRO</span>
      <span style="flex:1"></span>
      <button id="profile-switch" class="chip" type="button">…</button>
      <div id="sync" class="sync" title="Connection status"><span class="dot"></span><span class="sync-label">…</span></div>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav id="tabs">
    <button data-route="log"       type="button"><span class="tab-icon" data-icon="notebook-pen"></span>Log</button>
    <button data-route="history"   type="button"><span class="tab-icon" data-icon="calendar-days"></span>History</button>
    <button data-route="exercises" type="button"><span class="tab-icon" data-icon="dumbbell"></span>Exercises</button>
    <button data-route="alerts"    type="button"><span class="tab-icon" data-icon="bell"></span>Alerts</button>
    <button data-route="settings"  type="button"><span class="tab-icon" data-icon="settings"></span>Settings</button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <!-- Runs before the module graph. A failed import throws before any of our own
       code executes, so app.js can never report it — twice that showed up as a
       splash which simply never finished. This surfaces it AND offers a real fix:
       a stale module cannot be evicted by a normal reload, because the cached
       entry was stored before no-store headers existed. fetch(cache:'reload')
       bypasses the HTTP cache and rewrites each entry, so the reload after it
       gets current code. -->
  <script>
    (function () {
      var MODULES = [
        'js/app.js', 'js/firebase.js', 'js/store.js', 'js/sides.js',
        'js/search.js', 'js/units.js', 'js/ui.js', 'js/notify.js',
        'js/seed.js', 'js/version.js', 'js/usage.js',
        'js/progress.js', 'js/chart.js', 'js/edits.js', 'js/rest.js', 'js/notes.js',
        'js/resttimer.js', 'js/learn.js', 'js/icons.js', 'js/sync.js',
        'js/pr.js', 'js/streak.js', 'js/nextset.js'
      ];
      var shown = false;

      function show(msg) {
        if (shown) return;          // one report, however many errors cascade
        shown = true;

        var stage = document.getElementById('splash-stage');
        var bar = document.querySelector('.splash-steps');
        if (bar) bar.style.display = 'none';
        if (!stage) return;

        stage.className = 'splash-stage failed';
        stage.textContent = msg;

        var wrap = document.createElement('div');
        wrap.className = 'splash-hint';

        // Guard against a reload loop when the error is not cache-related.
        if (sessionStorage.getItem('gn.refetched') === '1') {
          wrap.textContent = 'Already refetched, so this is not a stale file. '
            + 'Check the console for the underlying error.';
          stage.parentNode.insertBefore(wrap, stage.nextSibling);
          return;
        }

        var btn = document.createElement('button');
        btn.className = 'splash-fix';
        btn.textContent = 'Reload with fresh files';
        btn.onclick = function () {
          btn.disabled = true;
          btn.textContent = 'Refetching…';
          sessionStorage.setItem('gn.refetched', '1');
          Promise.all(MODULES.map(function (u) {
            return fetch(u, { cache: 'reload' }).catch(function () {});
          })).then(function () { location.reload(); });
        };

        wrap.appendChild(btn);
        var note = document.createElement('div');
        note.style.marginTop = '9px';
        note.textContent = 'Or hard-refresh: Cmd/Ctrl + Shift + R';
        wrap.appendChild(note);
        stage.parentNode.insertBefore(wrap, stage.nextSibling);
      }

      window.addEventListener('error', function (e) {
        show(e.message || 'Failed to load the app');
      });
      window.addEventListener('unhandledrejection', function (e) {
        show((e.reason && e.reason.message) || 'Startup failed');
      });
      // A clean start means whatever we refetched worked; drop the guard.
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!shown) sessionStorage.removeItem('gn.refetched');
        }, 3000);
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
